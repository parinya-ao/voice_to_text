[project]
name = "sound-to-text"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "parinya-ao", email = "flim.parinya.ao@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "av>=18.1.0",
    "faster-whisper>=1.2.1",
    "matplotlib>=3.11.1",
    "notebook>=7.6.2",
    "numpy>=2.5.2",
    "scipy>=1.18.1",
    "soundfile>=0.13.1",
]

[project.scripts]
sound-to-text = "sound_to_text:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
